<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm Tra Tenant Microsoft 365 - Hachihi</title>
    <!-- Nhúng Font Inter chuẩn hiện đại -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --hachihi-primary: #0052cc;
            --hachihi-primary-hover: #0041a3;
            --hachihi-accent: #0066ff;
            --hachihi-bg: #f4f7fa;
            --hachihi-card-bg: #ffffff;
            --hachihi-text: #172b4d;
            --hachihi-subtext: #5e6c84;
            --hachihi-success: #36b37e;
            --hachihi-danger: #ff5630;
            --hachihi-border: #dfe1e6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--hachihi-bg);
            color: var(--hachihi-text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: var(--hachihi-card-bg);
            border-radius: 12px;
            padding: 40px 32px;
            box-shadow: 0 10px 25px rgba(0, 82, 204, 0.08);
            border: 1px solid var(--hachihi-border);
            text-align: center;
        }

        /* Logo Hachihi */
        .logo-container {
            margin-bottom: 24px;
        }

        .logo-container img {
            max-height: 55px;
            max-width: 220px;
            object-fit: contain;
        }

        /* Header */
        h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--hachihi-primary);
            margin-bottom: 6px;
        }

        p.subtitle {
            font-size: 14px;
            color: var(--hachihi-subtext);
            margin-bottom: 28px;
        }

        /* Form Input */
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--hachihi-text);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 2px solid var(--hachihi-border);
            border-radius: 8px;
            outline: none;
            transition: all 0.2s ease;
            color: var(--hachihi-text);
            background: #fafbfc;
        }

        input[type="text"]:focus {
            border-color: var(--hachihi-accent);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.15);
        }

        .suffix {
            position: absolute;
            right: 14px;
            font-size: 13px;
            font-weight: 500;
            color: var(--hachihi-subtext);
            pointer-events: none;
        }

        .hint {
            font-size: 12px;
            color: var(--hachihi-subtext);
            margin-top: 6px;
        }

        /* Button */
        .btn {
            width: 100%;
            background-color: var(--hachihi-primary);
            color: #ffffff;
            border: none;
            padding: 13px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(0, 82, 204, 0.2);
        }

        .btn:hover {
            background-color: var(--hachihi-primary-hover);
        }

        .btn:active {
            transform: scale(0.99);
        }

        .btn:disabled {
            background-color: #a5adba;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Result Card */
        .result-card {
            margin-top: 24px;
            padding: 18px;
            border-radius: 8px;
            text-align: left;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .result-card.available {
            background-color: #e3fcef;
            border: 1px solid #abf5d1;
            color: #006644;
        }

        .result-card.not-available {
            background-color: #ffebe6;
            border: 1px solid #ffbdad;
            color: #bf2600;
        }

        .result-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .result-detail {
            font-size: 13px;
            opacity: 0.9;
            word-break: break-all;
            margin-top: 4px;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: var(--hachihi-subtext);
        }

        .footer a {
            color: var(--hachihi-primary);
            text-decoration: none;
            font-weight: 600;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Logo Google Drive Hachihi -->
    <div class="logo-container">
        <img src="https://lh3.googleusercontent.com/d/1z8McGUxFssJJy7iFD0jaBeC0LfIGuDcf" alt="Hachihi Logo" onerror="this.onerror=null; this.src='https://hachihi.vn/logo.png';">
    </div>

    <h1>Microsoft 365</h1>
    <p class="subtitle">Kiểm tra tính khả dụng của Tenant Name</p>

    <div class="input-group">
        <label for="tenantInput">Tên Tenant muốn kiểm tra</label>
        <div class="input-wrapper">
            <input type="text" id="tenantInput" placeholder="nhap-ten-tenant" onkeypress="if(event.key==='Enter') checkTenant()">
        </div>
        <div class="hint">Chỉ sử dụng chữ cái không dấu và chữ số. Không khoảng trắng.</div>
    </div>

    <button class="btn" id="checkBtn" onclick="checkTenant()">Kiểm Tra Ngay</button>

    <div id="resultCard" class="result-card">
        <div class="result-title" id="resStatus"></div>
        <div class="result-detail" id="resEmail"></div>
        <div class="result-detail" id="resSharepoint"></div>
    </div>

    <div class="footer">
        Cung cấp bởi <a href="https://hachihi.vn" target="_blank">Hachihi Technology</a>
    </div>
</div>

<script>
    async function checkTenant() {
        const input = document.getElementById('tenantInput');
        const name = input.value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');

        if (!name) return;

        const btn = document.getElementById('checkBtn');
        btn.disabled = true;
        btn.innerText = 'Đang kiểm tra...';

        const url = `https://login.microsoftonline.com/${name}.onmicrosoft.com/v2.0/.well-known/openid-configuration`;

        try {
            const res = await fetch(url);
            // HTTP status 400 có nghĩa là tenant chưa đăng ký (còn trống)
            const isAvailable = (res.status === 400);
            displayResult(name, isAvailable);
        } catch (err) {
            alert('Lỗi kết nối kiểm tra. Vui lòng thử lại!');
        } finally {
            btn.disabled = false;
            btn.innerText = 'Kiểm Tra Ngay';
        }
    }

    function displayResult(name, isAvailable) {
        const card = document.getElementById('resultCard');
        card.style.display = 'block';

        if (isAvailable) {
            card.className = 'result-card available';
            document.getElementById('resStatus').innerHTML = '✔ Tên này còn trống (Available)';
        } else {
            card.className = 'result-card not-available';
            document.getElementById('resStatus').innerHTML = '✖ Tên đã được sử dụng (Not available)';
        }

        document.getElementById('resEmail').innerText = `• Email mặc định: you@${name}.onmicrosoft.com`;
        document.getElementById('resSharepoint').innerText = `• Trang SharePoint: https://${name}.sharepoint.com`;
    }
</script>

</body>
</html>
